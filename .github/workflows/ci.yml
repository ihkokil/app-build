name: CI Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-mobile.yml'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 🧪 Typecheck & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Production Build Test
        run: npm run build
        env:
          DB_HOST: srv992.hstgr.io
          DB_PORT: 3306
