name: Build & Release Mobile App (Android APK)

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0, v1.0.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: 🧪 Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Next.js Production Build Test
        run: npm run build
        env:
          DB_HOST: srv992.hstgr.io
          DB_PORT: 3306

  build-android:
    name: 📱 Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:sync

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        id: apk-prep
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="${{ inputs.version || 'dev' }}"
          fi
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/OmniTask-${VERSION}.apk
          echo "apk_path=release-output/OmniTask-${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTask-Android-APK
          path: ${{ steps.apk-prep.outputs.apk_path }}
          retention-days: 14

  build-ios:
    name: 🍏 Build iOS (Xcode)
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:sync

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -scheme App \
            -project App.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            clean build CODE_SIGNING_ALLOWED=NO

      - name: Package iOS Debug Build
        id: ios-prep
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="${{ inputs.version || 'dev' }}"
          fi
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/release-output/OmniTask-iOS-Simulator-${VERSION}.zip" App.app
          echo "ios_path=release-output/OmniTask-iOS-Simulator-${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTask-iOS-App
          path: ${{ steps.ios-prep.outputs.ios_path }}
          retention-days: 14

  create-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-output
          merge-multiple: true

      - name: Determine Version Tag
        id: release-tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: OmniTask ${{ steps.release-tag.outputs.tag }}
          body: |
            ## 📱 OmniTask Mobile Release (${{ steps.release-tag.outputs.tag }})

            ### What's Included:
            - **Cross-Platform Mobile UI**: Responsive design with bottom navigation, centered Floating Action Button, and bottom-sheet task dialogs.
            - **Remote MySQL Persistence**: Connected to remote Hostinger MariaDB/MySQL with dual-engine zero-downtime fallback.
            - **Android APK**: Install directly onto any Android device (Android 7.0+ / API 24+).
            - **iOS App**: Xcode project & iOS Simulator build bundle.

            ### How to Install on Android:
            1. Download the `.apk` file below directly to your phone.
            2. Tap the downloaded file in your notifications or Downloads folder.
            3. If prompted, allow "Install Unknown Apps" for your browser/files app.
            4. Launch **OmniTask**!

            ### iOS Development:
            Open `ios/App/App.xcodeproj` in Xcode on macOS, select your development team, and press **Run** on your iPhone or Simulator.
          files: release-output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
